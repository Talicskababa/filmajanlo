<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmBox - Filmajánló</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 FilmBox</h1>

        <nav>
            <a href="#">Főoldal</a>
            <a href="#filmek">Filmek</a>
            <a href="#ajanlo">Filmajánló</a>
        </nav>
    </header>

    <main>

        <section class="filmkereso">
            <h2>Találd meg a következő kedvenc filmed!</h2>
            <p>Válassz egy műfajt, és mi ajánlunk neked egy filmet.</p>

            <div class="kereso">
                <input type="text" id="kereses" placeholder="Film keresése...">
                <button onclick="kereses()">🔎 Keresés</button>
            </div>
        </section>

        <section id="ajanlo" class="ajanlo">
            <h2>Film ajánlása</h2>

            <select id="mufaj">
                <option value="mind">Minden műfaj</option>
                <option value="fantasy">Fantasy</option>
                <option value="akcio">Akció</option>
                <option value="vigjatek">Vígjáték</option>
                <option value="horror">Horror</option>
                <option value="gyerek">Gyerek</option>
            </select>

            <button onclick="ajanlFilm()">Ajánlj egy filmet!</button>
        </section>

        <section id="filmek">
            <h2>⭐ Népszerű filmek</h2>
            <div class="filmek" id="filmLista">
                
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
